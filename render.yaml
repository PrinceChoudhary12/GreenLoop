services:
  - type: web
    name: greencycle-backend
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    preDeployCommand: python -m backend.scripts.run_migrations
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PYTHONPATH
        value: .
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: CLOUDINARY_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
